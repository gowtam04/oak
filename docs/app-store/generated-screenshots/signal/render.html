<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Oak Signal — App Store frames</title>
  <style>
    @font-face { font-family: Figtree; src: url("fonts/Figtree-Regular.ttf"); font-weight: 400; }
    @font-face { font-family: Figtree; src: url("fonts/Figtree-Medium.ttf"); font-weight: 500; }
    @font-face { font-family: Figtree; src: url("fonts/Figtree-SemiBold.ttf"); font-weight: 600; }
    @font-face { font-family: Plex; src: url("fonts/IBMPlexMono-Regular.ttf"); font-weight: 400; }
    @font-face { font-family: Plex; src: url("fonts/IBMPlexMono-Medium.ttf"); font-weight: 500; }

    :root {
      --bg: #F6F7F9;
      --surface: #FFFFFF;
      --sunken: #EEF0F3;
      --line: #E3E8EF;
      --ink: #1B2430;
      --text: #2A3340;
      --mute: #5B6B7C;
      --faint: #8A94A0;
      --red: #E3350D;
      --on-red: #FFFFFF;
      --dragon: #6F35FC;
      --ground: #E2BF65;
      --steel: #B7B7CE;
      --water: #6390F0;
      --fire: #EE8130;
      --fairy: #D685AD;
      --ghost: #735797;
      --dark: #705746;
      --electric: #F7D02C;
      --chip-ink: #16181A;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); }
    body { font-family: Figtree, system-ui, sans-serif; color: var(--ink); }

    .frame { width: 100vw; height: 100vh; position: relative; background: var(--bg); }
    .copy {
      position: absolute; top: 4.6vh; left: 7vw; right: 7vw;
      text-align: center; z-index: 4;
    }
    .copy h1 {
      font-weight: 600; letter-spacing: -0.03em; line-height: 1.05;
      font-size: clamp(56px, 7.1vw, 92px); color: var(--ink);
    }
    .copy p {
      margin-top: 18px; font-weight: 500; color: var(--mute);
      font-size: clamp(26px, 2.7vw, 36px); line-height: 1.28;
    }

    .stage {
      position: absolute; inset: 0; display: grid; place-items: center;
      padding-top: 15.8vh;
    }
    .phone {
      --w: min(70vw, 820px);
      width: var(--w);
      height: calc(var(--w) * 2.164);
      position: relative;
      border-radius: calc(var(--w) * 0.12);
      background: #1a1d22;
      box-shadow:
        0 1px 0 rgba(255,255,255,0.35) inset,
        0 40px 80px -24px rgba(27,36,48,0.28);
      padding: calc(var(--w) * 0.018);
    }
    .screen {
      position: absolute; inset: calc(var(--w) * 0.018);
      border-radius: calc(var(--w) * 0.104);
      overflow: hidden;
      background: var(--bg);
    }
    .island {
      position: absolute; top: 1.7%; left: 50%; transform: translateX(-50%);
      width: 28%; height: 3.05%; border-radius: 999px; background: #050608; z-index: 8;
    }
    .app { position: absolute; inset: 0; display: flex; flex-direction: column; }
    #ui { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .status {
      height: 7.4%;
      display: flex; align-items: flex-end; justify-content: space-between;
      padding: 0 7.4% 1.4%;
      font-size: calc(var(--w) * 0.034); font-weight: 600; color: var(--ink);
    }
    .status .icons { letter-spacing: 0.18em; font-size: calc(var(--w) * 0.028); color: var(--ink); }
    .header {
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.6% 5.4% 2.2%;
    }
    .wordmark { font-weight: 600; font-size: calc(var(--w) * 0.048); letter-spacing: -0.03em; }
    .wordmark i { color: var(--red); font-style: normal; }
    .scope {
      display: inline-flex; align-items: center; gap: 8px;
      color: var(--mute); font-weight: 500; font-size: calc(var(--w) * 0.028);
    }
    .led { width: 7px; height: 7px; border-radius: 50%; background: var(--red); }
    .new {
      width: calc(var(--w) * 0.086); height: calc(var(--w) * 0.086);
      border-radius: 50%; border: 1px solid var(--line); background: var(--surface);
      display: grid; place-items: center; color: var(--ink); font-size: calc(var(--w) * 0.038);
    }
    .body { flex: 1; min-height: 0; padding: 0 5.2% 3%; overflow: hidden; }
    .note {
      margin-left: auto; max-width: 78%;
      background: var(--sunken); border: 1px solid var(--line);
      border-radius: 12px; padding: 3.1% 3.6%;
      font-size: calc(var(--w) * 0.032); line-height: 1.35; color: var(--ink);
    }
    .plate {
      margin-top: 3.2%;
      background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
      padding: 4.2% 4.4% 3.8%;
    }
    .lead { font-weight: 600; font-size: calc(var(--w) * 0.044); letter-spacing: -0.02em; line-height: 1.22; }
    .prose { margin-top: 2.4%; color: var(--text); font-size: calc(var(--w) * 0.03); line-height: 1.45; }
    .facts { margin-top: 3.4%; }
    .fact {
      display: grid; grid-template-columns: 1fr auto; gap: 12px;
      padding: 2.1% 0; border-top: 1px solid var(--line);
      font-family: Plex, ui-monospace, monospace;
    }
    .fact:first-child { border-top: 0; }
    .fact .k { color: var(--mute); font-size: calc(var(--w) * 0.024); font-weight: 500; }
    .fact .v { color: var(--ink); font-size: calc(var(--w) * 0.026); }
    .subject {
      margin-top: 3.2%; display: flex; align-items: center; gap: 3.4%;
    }
    .sprite {
      width: calc(var(--w) * 0.148); height: calc(var(--w) * 0.148);
      border-radius: 10px; background: var(--sunken);
      display: grid; place-items: center; overflow: hidden;
    }
    .sprite img { width: 86%; image-rendering: pixelated; }
    .name { font-weight: 600; font-size: calc(var(--w) * 0.034); }
    .dex { color: var(--mute); font-weight: 500; font-size: calc(var(--w) * 0.024); margin-left: 6px; }
    .types { display: flex; gap: 6px; margin-top: 7px; }
    .type {
      font-size: calc(var(--w) * 0.022); font-weight: 600;
      padding: 3px 9px; border-radius: 8px; color: var(--chip-ink);
    }
    .type.dragon { background: var(--dragon); color: #fff; }
    .type.ground { background: var(--ground); }
    .type.steel { background: var(--steel); }
    .type.water { background: var(--water); }
    .type.fire { background: var(--fire); }
    .type.fairy { background: var(--fairy); }
    .type.ghost { background: var(--ghost); color: #fff; }
    .type.dark { background: var(--dark); color: #fff; }
    .type.electric { background: var(--electric); }
    .type.grass { background: #7AC74C; }
    .inferred { margin-top: 3%; font-size: calc(var(--w) * 0.026); color: var(--mute); }
    .inferred b { color: var(--red); font-weight: 600; }
    .meta-row { display: flex; gap: 8px; margin-top: 3.2%; }
    .pill {
      border: 1px solid var(--line); background: var(--surface); color: var(--mute);
      border-radius: 999px; padding: 0.7em 1em;
      font-size: calc(var(--w) * 0.022); font-weight: 500;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 2.8%; }
    .chip {
      background: var(--surface); border: 1px solid var(--line);
      border-radius: 999px; padding: 0.7em 1em;
      font-size: calc(var(--w) * 0.024); font-weight: 500; color: var(--text);
    }
    .composer {
      flex-shrink: 0;
      margin: 0 5.2% 2.2%;
      display: flex; align-items: center; gap: 8px;
      background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
      padding: 2.4% 2.6%;
    }
    .composer .ph { flex: 1; color: var(--faint); font-size: calc(var(--w) * 0.028); font-weight: 500; }
    .send {
      width: calc(var(--w) * 0.086); height: calc(var(--w) * 0.086);
      border-radius: 10px; background: var(--red); color: var(--on-red);
      display: grid; place-items: center; font-weight: 600; font-size: calc(var(--w) * 0.036);
    }
    .tabs {
      flex-shrink: 0;
      height: 10.4%;
      display: grid; grid-template-columns: repeat(4, 1fr);
      background: rgba(246,247,249,0.96);
      border-top: 1px solid var(--line);
      padding-bottom: 2.6%;
    }
    .tab {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 4px; color: var(--mute); font-size: calc(var(--w) * 0.022); font-weight: 500;
    }
    .tab.on { color: var(--red); }
    .tab .ic { font-size: calc(var(--w) * 0.042); line-height: 1; }

    .title-lg {
      flex-shrink: 0;
      padding: 1% 5.4% 2%;
      font-weight: 600; font-size: calc(var(--w) * 0.072); letter-spacing: -0.03em;
    }
    .title-sub {
      flex-shrink: 0;
      padding: 0 5.4% 2.4%;
      color: var(--mute); font-weight: 500; font-size: calc(var(--w) * 0.028);
    }
    .row {
      display: flex; align-items: center; gap: 3.4%;
      background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
      padding: 3% 3.4%; margin-bottom: 2.4%;
    }
    .row .who { flex: 1; }
    .row .who strong { display: block; font-size: calc(var(--w) * 0.032); font-weight: 600; }
    .row .who span { color: var(--mute); font-size: calc(var(--w) * 0.024); font-weight: 500; }
    .menu {
      margin-top: 2.4%;
      background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
      box-shadow: 0 12px 32px -16px rgba(27,36,48,0.18);
      overflow: hidden;
    }
    .menu button {
      width: 100%; text-align: left; border: 0; background: transparent;
      padding: 3.2% 4%; font: 500 calc(var(--w) * 0.03)/1.2 Figtree, sans-serif;
      color: var(--ink); border-top: 1px solid var(--line);
    }
    .menu button:first-child { border-top: 0; }
    .picker {
      background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
      overflow: hidden; margin-top: 2%;
    }
    .pick {
      display: flex; align-items: center; gap: 12px;
      padding: 3.6% 4.2%; border-top: 1px solid var(--line);
      font-size: calc(var(--w) * 0.032); font-weight: 500;
    }
    .pick.head {
      display: block; padding: 3.2% 4.2% 1.2%; border-top: 1px solid var(--line);
      color: var(--faint); font-size: calc(var(--w) * 0.022); letter-spacing: 0.06em;
      text-transform: uppercase; font-weight: 600;
    }
    .pick.head:first-child { border-top: 0; }
    .pick.on .lab { font-weight: 600; }
    .bar { width: 3px; height: 16px; border-radius: 99px; background: transparent; flex: 0 0 3px; }
    .pick.on .bar { background: var(--red); }
    .sheet {
      position: absolute; left: 0; right: 0; bottom: 10.4%;
      height: 54%; background: var(--surface);
      border-radius: 16px 16px 0 0;
      box-shadow: 0 -18px 40px -20px rgba(27,36,48,0.28);
      padding: 3.2% 5.4% 2%;
      z-index: 5;
    }
    .grab { width: 42px; height: 5px; border-radius: 99px; background: var(--line); margin: 0 auto 3.4%; }
    .starters .row { margin-bottom: 2.2%; }
    .cat { color: var(--mute); font-size: calc(var(--w) * 0.022); font-weight: 500; margin-bottom: 3px; }
    .banner {
      display: flex; align-items: center; justify-content: space-between;
      margin: 0 0 3%; color: var(--mute); font-size: calc(var(--w) * 0.024); font-weight: 500;
    }
    .banner a { color: var(--red); font-weight: 600; text-decoration: none; }
    .dim { position: absolute; inset: 0; background: rgba(27,36,48,0.18); }
    [hidden] { display: none !important; }
  </style>
</head>
